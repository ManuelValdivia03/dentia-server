services:
  postgres:
    image: postgres:16
    container_name: dentia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_APPOINTMENTS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_APPOINTMENTS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dentia-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dentia
      RABBITMQ_DEFAULT_PASS: dentia123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: dentia-auth-service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_SERVICE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_AUTH_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT}:3001"

  appointments-service:
    build:
      context: ./appointments-service
      dockerfile: Dockerfile
    container_name: dentia-appointments-service
    restart: unless-stopped
    environment:
      PORT: ${APPOINTMENTS_HTTP_PORT}
      APPOINTMENTS_TCP_HOST: 0.0.0.0
      APPOINTMENTS_TCP_PORT: ${APPOINTMENTS_TCP_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_APPOINTMENTS_DB}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE_APPOINTMENTS: ${RABBITMQ_QUEUE_APPOINTMENTS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APPOINTMENTS_HTTP_PORT}:3002"
      - "${APPOINTMENTS_TCP_PORT}:${APPOINTMENTS_TCP_PORT}"

  prescriptions-service:
    build:
      context: ./prescriptions-service
      dockerfile: Dockerfile
    container_name: dentia-prescriptions-service
    restart: unless-stopped
    environment:
      PORT: ${PRESCRIPTIONS_SERVICE_PORT}
      PRESCRIPTIONS_TCP_HOST: 0.0.0.0
      PRESCRIPTIONS_TCP_PORT: ${PRESCRIPTIONS_TCP_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_PRESCRIPTIONS_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PRESCRIPTIONS_SERVICE_PORT}:3003"
      - "${PRESCRIPTIONS_TCP_PORT}:${PRESCRIPTIONS_TCP_PORT}"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: dentia-api-gateway
    restart: unless-stopped
    environment:
      PORT: ${API_GATEWAY_PORT}
      AUTH_SERVICE_URL: http://auth-service:3001
      APPOINTMENTS_TCP_HOST: appointments-service
      APPOINTMENTS_TCP_PORT: ${APPOINTMENTS_TCP_PORT}
      PRESCRIPTIONS_TCP_HOST: prescriptions-service
      PRESCRIPTIONS_TCP_PORT: ${PRESCRIPTIONS_TCP_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - appointments-service
      - prescriptions-service
    ports:
      - "${API_GATEWAY_PORT}:3000"

volumes:
  postgres_data: