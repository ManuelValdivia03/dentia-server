services:
  postgres:
    image: postgres:16
    container_name: dentia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_APPOINTMENTS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_APPOINTMENTS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dentia-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dentia-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dentia
      RABBITMQ_DEFAULT_PASS: dentia123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dentia-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: dentia-auth-service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_SERVICE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_AUTH_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2m}
      REFRESH_TOKEN_IDLE_TIMEOUT_SECONDS: ${REFRESH_TOKEN_IDLE_TIMEOUT_SECONDS:-300}
      REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:-28800}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_REGISTER_RATE_LIMIT_MAX: ${AUTH_REGISTER_RATE_LIMIT_MAX:-3}
      AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_VERIFY_EMAIL_RATE_LIMIT_MAX: ${AUTH_VERIFY_EMAIL_RATE_LIMIT_MAX:-5}
      AUTH_VERIFY_EMAIL_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_VERIFY_EMAIL_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_RESEND_VERIFICATION_RATE_LIMIT_MAX: ${AUTH_RESEND_VERIFICATION_RATE_LIMIT_MAX:-3}
      AUTH_RESEND_VERIFICATION_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RESEND_VERIFICATION_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_MAX: ${AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_MAX:-3}
      AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_RESET_PASSWORD_RATE_LIMIT_MAX: ${AUTH_RESET_PASSWORD_RATE_LIMIT_MAX:-5}
      AUTH_RESET_PASSWORD_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RESET_PASSWORD_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_MAX_FAILED_LOGIN_ATTEMPTS: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:-5}
      AUTH_LOGIN_LOCKOUT_SECONDS: ${AUTH_LOGIN_LOCKOUT_SECONDS:-900}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-10}
      PASSWORD_RESET_RESEND_COOLDOWN_SECONDS: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_LOCKOUT_SECONDS: ${PASSWORD_RESET_LOCKOUT_SECONDS:-900}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS}
      EMAIL_VERIFICATION_LOCKOUT_SECONDS: ${EMAIL_VERIFICATION_LOCKOUT_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT}:3001"
    networks:
      - dentia-network

  appointments-service:
    build:
      context: ./appointments-service-csharp/Dentia.Appointments.Api
      dockerfile: Dockerfile
    container_name: dentia-appointments-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_APPOINTMENTS_DB}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REPORTS_SERVICE_URL: http://reports-service:3006
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE_APPOINTMENTS: ${RABBITMQ_QUEUE_APPOINTMENTS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reports-service:
        condition: service_started
    ports:
      - "${APPOINTMENTS_HTTP_PORT}:3002"
    networks:
      - dentia-network

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    container_name: dentia-notifications-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_AUTH_DB}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE_APPOINTMENTS: ${RABBITMQ_QUEUE_APPOINTMENTS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dentia-network

  prescriptions-service:
    build:
      context: ./prescriptions-service
      dockerfile: Dockerfile
    container_name: dentia-prescriptions-service
    restart: unless-stopped
    environment:
      PORT: ${PRESCRIPTIONS_SERVICE_PORT}
      PRESCRIPTIONS_TCP_HOST: 0.0.0.0
      PRESCRIPTIONS_TCP_PORT: ${PRESCRIPTIONS_TCP_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_PRESCRIPTIONS_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PRESCRIPTIONS_SERVICE_PORT}:3003"
      - "${PRESCRIPTIONS_TCP_PORT}:${PRESCRIPTIONS_TCP_PORT}"
    networks:
      - dentia-network

  chat-mongo:
    image: mongo:7
    container_name: dentia-chat-mongo
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - chat_mongo_data:/data/db
    networks:
      - dentia-network
    
  files-mongo:
    image: mongo:7
    container_name: dentia-files-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - files_mongo_data:/data/db
    networks:
      - dentia-network

  chat-service:
    build:
      context: ./chat-service-csharp/ChatService
      dockerfile: Dockerfile
    container_name: dentia-chat-service
    restart: unless-stopped
    depends_on:
      - chat-mongo
      - appointments-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:3004
      MONGODB_URI: mongodb://chat-mongo:27017/dentia_chat
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "3004:3004"
    networks:
      - dentia-network

  neo4j:
    image: neo4j:5
    container_name: dentia-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/dentia_reports_password
    volumes:
      - neo4j_data:/data
    networks:
      - dentia-network

  reports-service:
    build:
      context: ./reports-service
      dockerfile: Dockerfile
    container_name: dentia-reports-service
    ports:
      - "3006:3006"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dentia_reports_password
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - neo4j
    networks:
      - dentia-network
    
  files-service:
    build:
      context: ./files-service-csharp/FilesService
      dockerfile: Dockerfile
    container_name: dentia-files-service
    restart: unless-stopped
    ports:
      - "3005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://files-mongo:27017
      Mongo__DatabaseName: dentia_files
      Mongo__FilesCollection: clinical_files
      Storage__Path: /app/uploads
      Jwt__Secret: ${JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - files_uploads:/app/uploads
    depends_on:
      - files-mongo
    networks:
      - dentia-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: dentia-api-gateway
    restart: unless-stopped
    environment:
      PORT: ${API_GATEWAY_PORT}
      AUTH_SERVICE_URL: http://auth-service:3001
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3002
      PRESCRIPTIONS_SERVICE_URL: http://prescriptions-service:3003
      PRESCRIPTIONS_TCP_HOST: prescriptions-service
      PRESCRIPTIONS_TCP_PORT: ${PRESCRIPTIONS_TCP_PORT}
      CHAT_SERVICE_URL: http://chat-service:3004
      FILES_SERVICE_URL: http://files-service:8080
      REPORTS_SERVICE_URL: http://reports-service:3006
      INTERNAL_API_KEY: dev-internal-key
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2m}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_REGISTER_RATE_LIMIT_MAX: ${AUTH_REGISTER_RATE_LIMIT_MAX:-3}
      AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_VERIFY_EMAIL_RATE_LIMIT_MAX: ${AUTH_VERIFY_EMAIL_RATE_LIMIT_MAX:-5}
      AUTH_VERIFY_EMAIL_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_VERIFY_EMAIL_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_RESEND_VERIFICATION_RATE_LIMIT_MAX: ${AUTH_RESEND_VERIFICATION_RATE_LIMIT_MAX:-3}
      AUTH_RESEND_VERIFICATION_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RESEND_VERIFICATION_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_MAX: ${AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_MAX:-3}
      AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_REQUEST_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:-600}
      AUTH_RESET_PASSWORD_RATE_LIMIT_MAX: ${AUTH_RESET_PASSWORD_RATE_LIMIT_MAX:-5}
      AUTH_RESET_PASSWORD_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RESET_PASSWORD_RATE_LIMIT_WINDOW_SECONDS:-600}
    depends_on:
      - auth-service
      - appointments-service
      - prescriptions-service
      - chat-service
      - files-service
      - reports-service
    ports:
      - "${API_GATEWAY_PORT}:3000"
    networks:
      - dentia-network

volumes:
  postgres_data:
  chat_mongo_data:
  files_mongo_data:
  files_uploads:
  neo4j_data:

networks:
  dentia-network:
    driver: bridge
