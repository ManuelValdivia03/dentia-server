services:
  postgres:
    image: postgres:16
    container_name: dentia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_APPOINTMENTS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_APPOINTMENTS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dentia-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dentia
      RABBITMQ_DEFAULT_PASS: dentia123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: dentia-auth-service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_SERVICE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_AUTH_DB}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT}:3001"

  appointments-service:
    build:
      context: ./appointments-service
      dockerfile: Dockerfile
    container_name: dentia-appointments-service
    restart: unless-stopped
    environment:
      PORT: ${APPOINTMENTS_HTTP_PORT}
      APPOINTMENTS_TCP_HOST: 0.0.0.0
      APPOINTMENTS_TCP_PORT: ${APPOINTMENTS_TCP_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_APPOINTMENTS_DB}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE_APPOINTMENTS: ${RABBITMQ_QUEUE_APPOINTMENTS}
      INTERNAL_API_KEY: dev-internal-key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APPOINTMENTS_HTTP_PORT}:3002"
      - "${APPOINTMENTS_TCP_PORT}:${APPOINTMENTS_TCP_PORT}"

  prescriptions-service:
    build:
      context: ./prescriptions-service
      dockerfile: Dockerfile
    container_name: dentia-prescriptions-service
    restart: unless-stopped
    environment:
      PORT: ${PRESCRIPTIONS_SERVICE_PORT}
      PRESCRIPTIONS_TCP_HOST: 0.0.0.0
      PRESCRIPTIONS_TCP_PORT: ${PRESCRIPTIONS_TCP_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_PRESCRIPTIONS_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PRESCRIPTIONS_SERVICE_PORT}:3003"
      - "${PRESCRIPTIONS_TCP_PORT}:${PRESCRIPTIONS_TCP_PORT}"

  chat-mongo:
    image: mongo:7
    container_name: dentia-chat-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - chat_mongo_data:/data/db
    
  files-mongo:
    image: mongo:7
    container_name: dentia-files-mongo
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - files_mongo_data:/data/db

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: dentia-chat-service
    restart: unless-stopped
    depends_on:
      - chat-mongo
      - appointments-service
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://chat-mongo:27017/dentia_chat
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3002
      INTERNAL_API_KEY: dev-internal-key
    ports:
      - "3004:3004"
    
  files-service:
    build:
      context: ./files-service
      dockerfile: Dockerfile
    container_name: dentia-files-service
    restart: unless-stopped
    depends_on:
      - files-mongo
    environment:
      PORT: 3005
      MONGODB_URI: mongodb://files-mongo:27017/dentia_files
      FILES_UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      INTERNAL_API_KEY: dev-internal-key
    volumes:
      - files_uploads:/app/uploads
    ports:
      - "3005:3005"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: dentia-api-gateway
    restart: unless-stopped
    environment:
      PORT: ${API_GATEWAY_PORT}
      AUTH_SERVICE_URL: http://auth-service:3001
      APPOINTMENTS_TCP_HOST: appointments-service
      APPOINTMENTS_TCP_PORT: ${APPOINTMENTS_TCP_PORT}
      PRESCRIPTIONS_TCP_HOST: prescriptions-service
      PRESCRIPTIONS_TCP_PORT: ${PRESCRIPTIONS_TCP_PORT}
      CHAT_SERVICE_URL: http://chat-service:3004
      FILES_SERVICE_URL: http://files-service:3005
      INTERNAL_API_KEY: dev-internal-key
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - appointments-service
      - prescriptions-service
      - chat-service
      - files-service
    ports:
      - "${API_GATEWAY_PORT}:3000"

volumes:
  postgres_data:
  chat_mongo_data:
  files_mongo_data:
  files_uploads: