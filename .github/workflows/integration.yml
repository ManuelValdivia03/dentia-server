name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Build and start integration environment
        run: docker compose -p dentia-it -f docker-compose.integration.yml up -d --build

      - name: Wait for healthy gateway
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3100/health \
              | jq -e '
                  .status == "ok"
                  and ([.checks.dependencies[] | .status] | all(. == "ok"))
                ' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Integration environment did not become healthy."
          exit 1

      - name: Seed deterministic data
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5439
          POSTGRES_USER: dentia_test
          POSTGRES_PASSWORD: dentia_test
          POSTGRES_DB: dentia_auth_test
        run: npm run seed:integration

      - name: Run integration tests
        env:
          API_BASE_URL: http://localhost:3100
          JWT_SECRET: integration_test_secret_at_least_32_chars
        run: npm run test:integration:jest

      - name: Run performance smoke test
        env:
          API_BASE_URL: http://localhost:3100
          PERF_PROFILE: smoke
          PERF_RESULTS_DIR: performance-results
        run: npm run test:performance:load

      - name: Upload smoke performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-results
          path: performance-results/
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: docker compose -p dentia-it -f docker-compose.integration.yml logs --tail 200

      - name: Stop integration environment
        if: always()
        run: docker compose -p dentia-it -f docker-compose.integration.yml down -v --remove-orphans
